name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Measured: MuJoCo/BLAS oversubscribe the runner's cores and lose ~2x
  # throughput without this. nova.cli sets the same default at runtime.
  OMP_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One version failing shouldn't hide whether the others pass.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # verify.py imports torch, onnx and stable-baselines3, so the base
      # install is not enough — it needs the train extra.
      - name: Install nova
        run: python -m pip install -e "./backend[train]"

      - name: Run verification suite
        working-directory: backend
        run: python scripts/verify.py

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` also typechecks, but running tsc on its own first
      # separates "types are wrong" from "the bundle failed to build".
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
